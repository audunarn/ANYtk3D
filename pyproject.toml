[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ANYtk3D"
version = "0.1.0"
description = "Fast dependency-free 3D drawing on a Tkinter Canvas - stiffened plates, cylinders, thickness colour-coding and camera orbit without OpenGL or matplotlib"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Audun Arnesen Nyhus", email = "audunarn@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["tkinter", "3d", "canvas", "visualization", "stiffened panel", "cylinder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "build"]

[project.urls]
Homepage = "https://github.com/audunarn/ANYtk3D"
Repository = "https://github.com/audunarn/ANYtk3D"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
